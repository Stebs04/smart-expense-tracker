<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Accedi - Expense Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

<div class="w-full max-w-md bg-white rounded-lg shadow-md p-8">

    <h2 class="text-2xl font-bold text-center text-blue-600 mb-6">Accedi</h2>

    <div th:if="${param.error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
        Email o Password non validi.
    </div>

    <div th:if="${param.logout}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4">
        Sei uscito correttamente.
    </div>

    <div th:if="${param.success}" class="bg-blue-100 border border-blue-400 text-blue-700 px-4 py-3 rounded mb-4">
        Registrazione completata! Ora puoi accedere.
    </div>

    <form th:action="@{/login}" method="post">

        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2">Email</label>
            <input type="email" name="username" required autofocus
                   class="w-full px-3 py-2 border rounded focus:outline-none focus:border-blue-500"
                   placeholder="mario.rossi@email.com">
        </div>

        <div class="mb-6">
            <label class="block text-gray-700 text-sm font-bold mb-2">Password</label>
            <input type="password" name="password" required
                   class="w-full px-3 py-2 border rounded focus:outline-none focus:border-blue-500"
                   placeholder="********">
        </div>

        <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700 transition duration-300">
            Accedi
        </button>

        <div class="mt-4 text-center">
            <p class="text-sm text-gray-600">Non hai un account?
                <a href="/register" class="text-blue-600 hover:underline">Registrati</a>
            </p>
        </div>

    </form>
</div>

</body>
</html>
