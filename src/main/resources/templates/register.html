<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrazione - Expense Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

<div class="w-full max-w-md bg-white rounded-lg shadow-md p-8">

    <h2 class="text-2xl font-bold text-center text-blue-600 mb-6">Crea un Account</h2>

    <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4" role="alert">
        <span class="block sm:inline" th:text="${error}">Errore generico</span>
    </div>

    <form th:action="@{/save-user}" th:object="${user}" method="post">

        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2">Nome</label>
            <input type="text" th:field="*{firstName}" required
                   class="w-full px-3 py-2 border rounded focus:outline-none focus:border-blue-500"
                   placeholder="Mario">
        </div>

        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2">Cognome</label>
            <input type="text" th:field="*{lastName}" required
                   class="w-full px-3 py-2 border rounded focus:outline-none focus:border-blue-500"
                   placeholder="Rossi">
        </div>

        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2">Email</label>
            <input type="email" th:field="*{email}" required
                   class="w-full px-3 py-2 border rounded focus:outline-none focus:border-blue-500"
                   placeholder="mario.rossi@email.com">
        </div>

        <div class="mb-6">
            <label class="block text-gray-700 text-sm font-bold mb-2">Password</label>
            <input type="password" th:field="*{password}" required
                   class="w-full px-3 py-2 border rounded focus:outline-none focus:border-blue-500"
                   placeholder="********">
        </div>

        <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700 transition duration-300">
            Registrati
        </button>

        <div class="mt-4 text-center">
            <p class="text-sm text-gray-600">Hai già un account?
                <a href="/login" class="text-blue-600 hover:underline">Accedi qui</a>
            </p>
        </div>

    </form>
</div>

</body>
</html>
