<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Le mie spese</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 font-sans">

    <div class="container mx-auto p-10">

        <div class="flex justify-between items-center mb-8">
            <h1 class="text-4xl font-bold text-blue-600">
                Le mie Spese
            </h1>
            <a href="/expense/new" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                Nuova Spesa
            </a>
        </div>

    </div>
    <div class="bg-white shadow-md rounded my-6 overflow-hidden">

        <table class="min-w-full table-auto">
            <thead class="bg-gray-800 text-white">
                <tr>
                    <th class="py-3 px-4 text-left uppercase font-semibold text-sm">Data</th>
                    <th class="py-3 px-4 text-left uppercase font-semibold text-sm">Descrizione</th>
                    <th class="py-3 px-4 text-left uppercase font-semibold text-sm">Categoria</th>
                    <th  class="py-3 px-4 text-left uppercase font-semibold text-sm">Importo</th>
                    <th class="py-3 px-4 text-left uppercase font-semibold text-sm">Azioni</th>
                </tr>
            </thead>

            <tbody class="text-gray-700">

                <tr th:each="spesa: ${expenses}" class="border-b hover:bg-gray-100">
                    <td class="py-3 px-4" th:text="${spesa.date}">01/01/2026</td>

                    <td class="py-3 px-4" th:text="${spesa.description}">Esempio</td>

                    <td class ="py-3 px-4">
                        <span class="bg-blue-200 text-blue-800 py-1 px-3 rounded-full text-xs" th:text="${spesa.category}">
                            Categoria
                        </span>
                    </td>

                    <td class="py-3 px-8" th:text="${spesa.amount} + ' €'">0.00 €</td>

                    <td class="py-3 px-4">
                            <a th:href="@{/expense/delete/{id}(id=${spesa.id})}" class="text-red-500 hover:text-red-700 font-bold">
                                Elimina
                            </a>
                        </td>
                    </tr>

                    <tr th:if="${expenses.isEmpty()}">
                        <td colspan="5" class="py-8 text-center text-gray-500">
                            Non hai ancora inserito nessuna spesa. Clicca su "Nuova Spesa"!
                        </td>
                </tr>
            </tbody>
        </table>

    </div>
</body>
</html>
